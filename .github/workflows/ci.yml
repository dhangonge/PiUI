name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # 7 个子命令串行（3 build + 4 test），慢 runner 上总时长可逼近 15 分钟；
    # 放宽到 25 分钟，避免偶发慢速触发 job 级超时误杀
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: ubuntu, os: ubuntu-latest }
          - { name: windows, os: windows-latest }

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # win32 专属补丁在非 Windows 上会让 patch-package 直接报错（包不存在）
      - name: drop windows-only patch
        if: runner.os != 'Windows'
        run: rm -f patches/@lydell+node-pty-win32-x64+*.patch

      - run: npm ci

      # 全量验证：typecheck + lint + 测试（默认 mock 驱动，不调用真实模型）+ 构建。
      # Ubuntu 那支额外收集 app 覆盖率（阈值写在 packages/app/vitest.config.ts），
      # 避免两支各跑一遍完整测试。
      - name: Validate (with coverage)
        if: matrix.os == 'ubuntu-latest'
        env:
          PIUI_TEST_COVERAGE: '1'
        run: npm run validate

      - name: Validate
        if: matrix.os != 'ubuntu-latest'
        run: npm run validate

      # 冒烟依赖上面 validate 已构建的 dist（app/dist + 三包的 dist），
      # 所以放在同一 job 里，不重复 build。
      - name: Resolve Chromium
        if: matrix.os == 'ubuntu-latest'
        run: |
          for bin in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$bin" >/dev/null 2>&1; then
              echo "CHROMIUM_BIN=$(command -v "$bin")" >> "$GITHUB_ENV"
              echo "smoke browser: $bin"
              exit 0
            fi
          done
          echo "no Chromium/Google Chrome found on PATH" >&2
          exit 1

      - name: Smoke (timeline order + android UI)
        if: matrix.os == 'ubuntu-latest'
        run: npm run smoke

  tauri-check:
    name: tauri check
    runs-on: ubuntu-latest
    # clippy --all-targets 比原来的 cargo check 多编译测试目标，首次（无缓存）
    # 会明显慢一截，放宽到 15 分钟。
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './packages/app/src-tauri -> target'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Drop Windows-only patch
        run: rm -f patches/@lydell+node-pty-win32-x64+*.patch

      - run: npm ci

      # tauri-build 校验 bundle.resources 引用的目录存在；tauri-check 只
      # 编译不打包，不需要真实资源内容，建空目录即可通过存在性检查。
      - name: Prepare empty tauri resources dir
        run: mkdir -p packages/app/src-tauri/resources

      # Tauri 壳的静态检查（clippy -D warnings 同时覆盖编译）与 Rust 单元测试，不打包
      - name: Cargo clippy
        working-directory: packages/app/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Cargo test
        working-directory: packages/app/src-tauri
        run: cargo test --lib
