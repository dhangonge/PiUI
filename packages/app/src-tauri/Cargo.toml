[package]
name = "piui"
version = "0.6.21"
description = "PiUI Android client"
authors = ["PiUI contributors"]
license = "GPL-3.0-only"
repository = ""
edition = "2021"
rust-version = "1.85.0"

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]
name = "piui_lib"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["devtools"] }
futures-util = "0.3"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["time", "net", "sync"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
strip = true
lto = true
panic = "abort"
codegen-units = 1
opt-level = "s"
